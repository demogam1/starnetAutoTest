<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <linearGradient id="emblemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B3" />
      <stop offset="40%" stop-color="#E8D48B" />
      <stop offset="70%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A7B2E" />
