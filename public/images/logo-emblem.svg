    <!-- Carbon pattern faithfully inspired by original diamond plate texture -->
    <pattern id="carbonGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#0A0A0D" />
      <rect width="5" height="5" fill="#141419" />
      <rect x="5" y="5" width="5" height="5" fill="#141419" />
    </pattern>
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

